<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | AI ML Agent</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        /* ================= BODY ================= */

        body {

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(124, 58, 237, 0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 20%,
                    rgba(236, 72, 153, 0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 95%,
                    rgba(250, 204, 21, 0.14),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 75% 65%,
                    rgba(168, 85, 247, 0.10),
                    transparent 28%
                ),

                linear-gradient(
                    135deg,
                    #fffaff 0%,
                    #f8f4ff 40%,
                    #fff5fb 72%,
                    #fffdf4 100%
                );
        }


        /* ================= LEFT GLOW ================= */

        body::before {

            content: "";

            position: fixed;

            width: 430px;

            height: 430px;

            left: -180px;

            top: 130px;

            border-radius: 50%;

            background:
                rgba(124, 58, 237, 0.13);

            filter: blur(35px);

            pointer-events: none;
        }


        /* ================= RIGHT GLOW ================= */

        body::after {

            content: "";

            position: fixed;

            width: 470px;

            height: 470px;

            right: -190px;

            bottom: -170px;

            border-radius: 50%;

            background:
                rgba(236, 72, 153, 0.12);

            filter: blur(35px);

            pointer-events: none;
        }



        /* ================= NAVBAR ================= */

        .navbar {

            position: fixed;

            top: 18px;

            left: 50%;

            transform: translateX(-50%);

            width:
                min(
                    1120px,
                    calc(100% - 35px)
                );

            height: 68px;

            padding: 0 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 1000;

            border:
                1px solid
                rgba(124, 58, 237, 0.12);

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.76);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 15px 45px
                rgba(72, 43, 120, 0.10);
        }



        /* ================= LOGO ================= */

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #24133f;

            text-decoration: none;

            font-size: 20px;

            font-weight: 700;
        }


        .logo-icon {

            width: 38px;

            height: 38px;

            display: grid;

            place-items: center;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            box-shadow:
                0 8px 22px
                rgba(124, 58, 237, 0.22);
        }



        /* ================= NAV LINKS ================= */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .nav-links a {

            color:
                #625a70;

            text-decoration: none;

            padding:
                11px 15px;

            border-radius: 11px;

            font-size: 14px;

            font-weight: 500;

            transition: 0.25s ease;
        }


        .nav-links a:hover {

            color: #6d28d9;

            background:
                rgba(124, 58, 237, 0.07);
        }


        .nav-links a.active {

            color: #6d28d9;

            background:
                rgba(124, 58, 237, 0.09);

            font-weight: 600;
        }



        /* ================= LOGOUT ================= */

        .logout-btn {

            border:
                1px solid
                rgba(236, 72, 153, 0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.08),
                    rgba(236, 72, 153, 0.08)
                );
        }


        .logout-btn:hover {

            color: #be185d !important;

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.13),
                    rgba(236, 72, 153, 0.13)
                ) !important;
        }



        /* ================= USER AREA ================= */

        .user-area {

            position: absolute;

            top: 125px;

            left: 50px;

            z-index: 2;

            color: #24133f;
        }


        .welcome-text {

            font-size: 14px;

            color:
                #8a8196;

            margin-bottom: 5px;
        }


        .username {

            font-size: 28px;

            font-weight: 700;

            color: #24133f;
        }


        .username span {

            color: #7c3aed;
        }



        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .navbar {

                width:
                    calc(100% - 20px);

                top: 10px;

                height: 62px;

                padding: 0 15px;
            }


            .nav-links {

                gap: 2px;
            }


            .nav-links a {

                padding:
                    9px 8px;

                font-size: 12px;
            }


            .nav-links a:not(.logout-btn) {

                display: none;
            }


            .logo span:last-child {

                display: none;
            }


            .user-area {

                top: 100px;

                left: 25px;
            }


            .username {

                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">


        <a href="/dashboard" class="logo">

            <span class="logo-icon">
                ✦
            </span>

            <span>
                AI ML Agent
            </span>

        </a>


        <div class="nav-links">


            <a
                href="/dashboard"
                class="active"
            >
                Dashboard
            </a>


            <a
                href="/logout"
                class="logout-btn"
            >
                Logout
            </a>


        </div>

    </nav>



    <!-- ================= USER NAME ================= -->

    <div class="user-area">

        <p class="welcome-text">
            Welcome back,
        </p>


        <h1 class="username">
            {{ name }}
        </h1>

    </div>


</body>

</html>
